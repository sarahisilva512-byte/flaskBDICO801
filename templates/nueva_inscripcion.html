{% extends "layout.html" %}

{% block content %}

<div class="max-w-lg mx-auto bg-white shadow-2xl rounded-3xl p-10 mt-10">
    <h2 class="text-3xl font-bold text-gray-800 mb-10 text-center">Nueva Inscripción</h2>

    <form action="{{ url_for('inscripciones.nueva_inscripcion') }}" method="POST" novalidate>
        {{ form.csrf_token }}

        <!-- Alumno -->
        <div class="mb-7">
            <label class="block text-sm font-medium text-gray-700 mb-2">
                Selecciona Alumno
            </label>
            <select name="alumno_id" required 
                    class="w-full px-4 py-3.5 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
                <option value="">-- Selecciona un alumno --</option>
                {% for alumno in alumnos %}
                <option value="{{ alumno.id }}">
                    {{ alumno.nombre }} {{ alumno.apaterno }} {{ alumno.amaterno or '' }}
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- Curso -->
        <div class="mb-10">
            <label class="block text-sm font-medium text-gray-700 mb-2">
                Selecciona Curso
            </label>
            <select name="curso_id" required 
                    class="w-full px-4 py-3.5 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
                <option value="">-- Selecciona un curso --</option>
                {% for curso in cursos %}
                <option value="{{ curso.id }}">
                    {{ curso.nombre }}
                    {% if curso.maestro %}
                        ({{ curso.maestro.nombre }} {{ curso.maestro.apellidos }})
                    {% endif %}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="flex gap-4">
            <button type="submit" 
                    class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 rounded-2xl transition-all duration-200">
                Realizar Inscripción
            </button>
            <a href="{{ url_for('inscripciones.inscripciones') }}" 
               class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-semibold py-4 rounded-2xl text-center transition-all duration-200">
                Cancelar
            </a>
        </div>
    </form>
</div>

{% endblock %}
