{% extends "layout.html" %}

{% block content %}

<div class="max-w-lg mx-auto bg-white shadow-xl rounded-2xl p-8 mt-10">
    <h2 class="text-3xl font-bold text-red-600 mb-2 text-center">¿Eliminar Curso?</h2>
    <p class="text-gray-600 text-center mb-8">Esta acción no se puede deshacer.</p>

    <div class="bg-gray-50 p-6 rounded-xl mb-8">
        <p><strong>Curso:</strong> {{ curso.nombre }}</p>
        <p><strong>Maestro:</strong> {{ curso.maestro.nombre }} {{ curso.maestro.apellidos if curso.maestro else '' }}</p>
    </div>

    <form action="" method="POST">
        <div class="flex gap-4">
            <button type="submit" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-4 rounded-xl">
                Sí, Eliminar Curso
            </button>
            <a href="{{ url_for('cursos.cursos') }}" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-semibold py-4 rounded-xl text-center">
                Cancelar
            </a>
        </div>
    </form>
</div>

{% endblock %}
