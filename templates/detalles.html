{% extends "layout.html" %}

{% block content %}

<div class="max-w-lg mx-auto mt-10">
    <div class="bg-white shadow-2xl rounded-3xl p-10 text-center">
        
        <!-- Avatar -->
        <div class="mx-auto w-32 h-32 bg-blue-100 text-blue-600 rounded-3xl flex items-center justify-center mb-8 shadow-inner">
            <i class="fas fa-user text-7xl"></i>
        </div>

        <!-- Nombre del Alumno -->
        <h1 class="text-4xl font-bold text-gray-800 mb-2">
            {{ nombre }} {{ apaterno }}
        </h1>
        
        {% if amaterno %}
        <p class="text-gray-600 text-lg mb-10">{{ amaterno }}</p>
        {% endif %}

        <!-- Información del Alumno -->
        <div class="bg-gray-50 rounded-2xl p-8 mb-12 space-y-8 text-left">
            <div class="flex justify-between items-center border-b border-gray-200 pb-6">
                <span class="text-sm font-medium text-gray-500">Correo Electrónico</span>
                <span class="font-semibold text-gray-800 text-lg">{{ email }}</span>
            </div>
            
            <div class="flex justify-between items-center border-b border-gray-200 pb-6">
                <span class="text-sm font-medium text-gray-500">Edad</span>
                <span class="font-semibold text-gray-800 text-lg">{{ edad }} años</span>
            </div>
            
            <div class="flex justify-between items-center">
                <span class="text-sm font-medium text-gray-500">ID del Alumno</span>
                <span class="font-semibold text-gray-800 text-lg">#{{ id }}</span>
            </div>
        </div>

        <!-- Botón Regresar -->
        <a href="{{ url_for('alumnos') }}" 
           class="inline-flex items-center gap-3 bg-green-600 hover:bg-green-700 text-white px-10 py-4 rounded-2xl font-medium transition-all duration-200">
            <i class="fas fa-arrow-left"></i>
            Regresar a la Lista
        </a>
    </div>
</div>

{% endblock %}
