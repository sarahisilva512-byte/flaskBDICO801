{% extends "layout.html" %}

{% block content %}

<div class="max-w-lg mx-auto bg-white shadow-xl rounded-2xl p-8 mt-10">
    <h2 class="text-3xl font-bold text-gray-800 mb-8 text-center">Registrar Nuevo Curso</h2>

    <form action="{{ url_for('cursos.cursos') }}" method="POST" novalidate>
        {{ form.csrf_token }}   <!-- ← Ahora sí existe -->

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Nombre del Curso
            </label>
            <input type="text" name="nombre" required 
                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Maestro Asignado
            </label>
            <select name="maestro_id" required 
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none">
                <option value="">-- Selecciona un maestro --</option>
                {% for maestro in maestros %}
                <option value="{{ maestro.id }}">
                    {{ maestro.nombre }} {{ maestro.apellidos }} - {{ maestro.especialidad }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="flex gap-4 mt-10">
            <button type="submit" 
                    class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-semibold py-4 rounded-xl">
                Guardar Curso
            </button>
            <a href="{{ url_for('cursos.cursos') }}" 
               class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-semibold py-4 rounded-xl text-center">
                Cancelar
            </a>
        </div>
    </form>
</div>

{% endblock %}
