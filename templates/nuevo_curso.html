{% extends "layout.html" %}

{% block content %}

<div class="max-w-lg mx-auto bg-white shadow-2xl rounded-3xl p-10 mt-10">
    <h2 class="text-3xl font-bold text-gray-800 mb-10 text-center">Nuevo Curso</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="mb-8 px-6 py-4 rounded-2xl text-center font-medium
                            {% if category == 'success' %}bg-green-100 text-green-700{% endif %}
                            {% if category == 'danger' %}bg-red-100 text-red-700{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('cursos.nuevo_curso') }}" method="POST" novalidate>
        {{ form.csrf_token }}

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Nombre del Curso</label>
            <input type="text" name="nombre" required
                   class="w-full px-4 py-3 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="mb-8">
            <label class="block text-sm font-medium text-gray-700 mb-2">Asignar Maestro</label>
            <select name="maestro_id" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-blue-500">
                <option value="">-- Selecciona un maestro --</option>
                {% for maestro in maestros %}
                <option value="{{ maestro.id }}">
                    {{ maestro.nombre }} {{ maestro.apellidos }} - {{ maestro.especialidad }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="flex gap-4">
            <button type="submit"
                    class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 rounded-2xl transition-all">
                Crear Curso
            </button>
            <a href="{{ url_for('cursos.cursos') }}"
               class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-semibold py-4 rounded-2xl text-center transition-all">
                Cancelar
            </a>
        </div>
    </form>
</div>

{% endblock %}
