<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Escolar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans">
    
    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">Sistema Escolar</h1>
           
            <div class="space-x-8 text-sm font-medium">
                <a href="{{ url_for('index') }}" class="hover:text-blue-600 transition-colors">Inicio</a>
                <a href="{{ url_for('alumnos.alumnos') }}" class="hover:text-blue-600 transition-colors">Alumnos</a>
                <a href="{{ url_for('maestros.maestros') }}" class="hover:text-blue-600 transition-colors">Maestros</a>
                <a href="{{ url_for('cursos.cursos') }}" class="hover:text-blue-600 transition-colors">Cursos</a>
                <a href="{{ url_for('consultas.consultas') }}" class="hover:text-blue-600 transition-colors">Consultas</a>
                <a href="{{ url_for('inscripciones.inscripciones') }}" class="hover:text-blue-600 transition-colors">Inscripciones</a>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="max-w-7xl mx-auto px-6 py-10">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
