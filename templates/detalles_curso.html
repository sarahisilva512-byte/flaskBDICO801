{% extends "layout.html" %}

{% block content %}

<div class="max-w-md mx-auto mt-10">
    <div class="bg-white shadow-xl rounded-3xl p-10 text-center">
        <h1 class="text-4xl font-bold text-gray-800 mb-4">{{ curso.nombre }}</h1>
        
        <div class="bg-gray-50 rounded-2xl p-8 mb-10">
            <div class="mb-6">
                <span class="text-sm text-gray-500 block">Maestro Asignado</span>
                <span class="font-medium text-xl">
                    {% if curso.maestro %}
                        {{ curso.maestro.nombre }} {{ curso.maestro.apellidos }}
                    {% else %}
                        Sin maestro asignado
                    {% endif %}
                </span>
            </div>
        </div>

        <a href="{{ url_for('cursos.cursos') }}" class="bg-green-600 hover:bg-green-700 text-white px-10 py-4 rounded-2xl font-medium">
            Regresar a la Lista
        </a>
    </div>
</div>

{% endblock %}
