{% extends "layout.html" %}

{% block content %}

<div class="max-w-lg mx-auto bg-white shadow-2xl rounded-3xl p-10 mt-10">
    <h2 class="text-3xl font-bold text-gray-800 mb-10 text-center">Modificar Curso</h2>

    <!-- Mensajes flash -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="mb-8 px-6 py-4 rounded-2xl text-center font-medium
                            {% if category == 'success' %}bg-green-100 text-green-700 border border-green-400{% endif %}
                            {% if category == 'danger' %}bg-red-100 text-red-700 border border-red-400{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('cursos.modificar_curso') }}" method="POST" novalidate>
        {{ form.csrf_token }}   <!-- ← CORREGIDO -->
        <input type="hidden" name="id" value="{{ curso.id }}">

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Nombre del Curso</label>
            <input type="text" name="nombre" value="{{ curso.nombre }}" required
                   class="w-full px-4 py-3 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
        </div>

        <div class="mb-10">
            <label class="block text-sm font-medium text-gray-700 mb-2">Maestro Asignado (no modificable)</label>
            <input type="text" value="{{ curso.maestro.nombre }} {{ curso.maestro.apellidos if curso.maestro else 'Sin maestro' }}" 
                   class="w-full px-4 py-3 border border-gray-300 rounded-2xl bg-gray-100 cursor-not-allowed" readonly>
        </div>

        <div class="flex gap-4">
            <button type="submit"
                    class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 rounded-2xl transition-all">
                Guardar Cambios
            </button>
            <a href="{{ url_for('cursos.cursos') }}"
               class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-semibold py-4 rounded-2xl text-center transition-all">
                Cancelar
            </a>
        </div>
    </form>
</div>

{% endblock %}
